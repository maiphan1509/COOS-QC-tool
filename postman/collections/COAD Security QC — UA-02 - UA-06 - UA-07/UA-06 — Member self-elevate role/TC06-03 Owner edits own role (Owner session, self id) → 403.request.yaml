$kind: http-request
description: "Load OWNER session. After fix: 403, owner role unchanged."
url: "{{advertiser_base_url}}/iam/members/accounts/{{owner_account_id}}/role-and-permission?type=advertiser"
method: POST
headers:
  Accept: application/json
  X-Requested-With: XMLHttpRequest
  Content-Type: application/json
  X-XSRF-TOKEN: "{{xsrf_token}}"
  Cookie: X-Org={{x_org}}; XSRF-TOKEN={{xsrf_cookie}}; coad_session={{coad_session}}
queryParams:
  type: advertiser
body:
  type: json
  content: |-
    {
      "roles": {
        "ADV.SUPERVISOR": {
          "label": "Supervisor",
          "value": true,
          "description": "Can supervise and manage advertiser operations",
          "code": "ADV.SUPERVISOR"
        }
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Owner cannot modify own roles (403)', function () {
        pm.response.to.have.status(403);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 3000
