$kind: collection
name: COAD Security QC — UA-02 / UA-06 / UA-07
description: |-
  Authorized QA verification of authorization fixes on the COAD DEV/UAT environment.

  UA-02 — Advertiser self-approve campaign version (privilege escalation on status).  
  UA-06 — Member self-elevate role (vertical privilege escalation).  
  UA-07 — Delete membership of another group/org (IDOR / broken object-level auth).

  HOW TO USE

  1. Import this collection + the COAD DEV environment file.
      
  2. Capture a valid request from the browser (DevTools > Network > Copy as cURL) and paste the real body/cookies. Only swap the field under test.
      
  3. Fill the collection variables (ids) and the environment variables (session/CSRF) for the account + org you are testing.
      
  4. Follow-redirects is DISABLED per request so Laravel 302/419/403/404 stays visible.
      
  5. Confirm post-condition in UI or DB — never conclude from HTTP status alone.
      
  6. On legacy (pre-fix) code UA-06/UA-07 really change data — undo role/membership after.
      

  Do not commit session cookies or CSRF tokens into a shared collection.
variables:
  campaign_id: ""
  version_id: ""
  attack_status: ""
  self_account_id: ""
  other_member_id: ""
  owner_account_id: ""
  group_A_id: ""
  group_A1_id: ""
  group_A2_id: ""
  group_B_id: ""
  membership_A1_id: ""
  membership_A2_id: ""
  membership_B_id: ""
  any_membership_id: ""
scripts:
  - type: http:beforeRequest
    code: |-
      pm.request.headers.remove('Cookie'); // let synced jar attach real cookies

      const jar = pm.cookies.jar();
      const url = pm.variables.replaceIn(pm.request.url.toString());
      const origin = (url.match(/^https?:\/\/[^/]+/) || [])[0];

      jar.get(origin, 'XSRF-TOKEN', (e, v) => {
        if (v) {
          const dec = decodeURIComponent(v);
          pm.environment.set('xsrf_cookie', v);
          pm.environment.set('xsrf_token', dec);
          pm.request.headers.upsert({ key: 'X-XSRF-TOKEN', value: dec });
          console.log('XSRF set len=', dec.length);
        } else { console.log('XSRF NULL for', origin, e); }
      });
      jar.get(origin, 'X-Org',        (e, v) => { if (v) pm.environment.set('x_org', v); });
      jar.get(origin, 'coad_session', (e, v) => { if (v) pm.environment.set('coad_session', v); });
    language: text/javascript
